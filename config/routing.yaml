# ============================================================================
# routing.yaml — Mapping trigger → actions
# ============================================================================
#
# Décision : cf. decisions.md 2026-05-21 — Refacto trigger/action/routing.
#
# Pour chaque trigger_name produit par dbt (table action_engine.triggers),
# liste les actions à exécuter quand une occurrence non encore traitée est détectée.
#
# Une action est typée :
#   - type: email_digest    — accumulée dans 1 mail par bucket (4h / daily / weekly)
#   - type: asana_task      — création de tâche Asana
#   - type: breezeway_task  — création de tâche Breezeway
#
# Idempotence : par (trigger_name, property_id, action_type) dans dispatched_actions.
# Si une action est déjà 'open' (= pas resolved), elle n'est pas redispatchée.
#
# Backlog : externaliser ce fichier vers DWH Feed Sheets (table BQ alimentée
# depuis Sheets) pour édition par Mickael sans commit. Voir Archides/CLAUDE.md.
# ============================================================================

# Recipients par défaut par bucket. Surchargeable per-trigger via params.recipients.
digest_buckets:
  2h:
    # Serrures — sécurité accès guest. Job merveil-action-engine-2h toutes les 2h.
    # TODO recipients : passer sur l'alias ops-front quand connu.
    send_if_empty: false
    subject_prefix: "[Merveil Serrures]"
    default_recipients:
      - alerte_ventes@archides.fr
      - hatim@archides.fr
  4h:
    send_if_empty: true
    subject_prefix: "[Merveil 4H]"
    default_recipients:
      - alerte_ventes@archides.fr
      - hatim@archides.fr
  daily:
    send_if_empty: false
    subject_prefix: "[Merveil Daily]"
    default_recipients:
      - alerte_ventes@archides.fr
      - hatim@archides.fr

  data_quality:
    # Gouvernance données fixes — violations de contrat (POC ops_apparts, owner Emilia).
    # ⚠ POC : route vers Hatim le temps de la validation. Pour passer en prod, basculer
    # default_recipients sur l'owner (emilia@archides.fr), ou implémenter le routage
    # dynamique depuis gouvernance_ownership.alert_email (évolution handler — Phase 2).
    # flush_with: daily = flushé par le job daily 7h (fix 2026-07-17 : sans ce champ,
    # le bucket était bufferisé puis jeté — 0 mail envoyé depuis sa création).
    flush_with: daily
    send_if_empty: false
    subject_prefix: "[Merveil Gouvernance]"
    default_recipients:
      - hatim@archides.fr

  beyond:
    # Push auto Beyond (gaps 1N) — succès de vente sous fenêtre DWH.
    # Destinataires dédiés (décision Hatim 17/07). Flushé par le job daily 7h.
    flush_with: daily
    send_if_empty: false
    subject_prefix: "[Merveil Beyond]"
    default_recipients:
      - hatim@archides.fr
      - raphael@archides.fr
      - mickael@archides.fr

  fraude:
    # Chargebacks et doubles sorties. Destinataires (2026-08-18) : Emilia monte
    # le dossier de preuve et porte la relation OTA, Philippe passe l'écriture et
    # suit le 411, Hatim en copie technique. ⚠ Emilia reçoit déjà une notification
    # Mews de son côté — doublon assumé : le mail d'ici porte le contexte séjour
    # (appart, dates, remboursement éventuel) que Mews ne donne pas.
    # ⚠ flush_with OBLIGATOIRE sur tout bucket satellite : sans lui le bucket est
    # bufferisé puis JETÉ sans erreur (incident data_quality, 2026-07-17).
    # Flushé par le job 2h : `trigger_new_chargeback` a 48 h pour agir, le daily
    # perdrait la moitié de la fenêtre.
    flush_with: 2h
    send_if_empty: false
    subject_prefix: "[Merveil Fraude]"
    # ⚠ `externe-onepilot@merveil.co` (2026-09-01, demande Hatim) : les agents
    # OnePilot prennent les appels — sur un test de cartes, c'est eux qui
    # vérifient/annulent au téléphone. 2ᵉ destinataire hors @archides.fr (après
    # hello@merveil.co au bucket blacklist) : compte PARTAGÉ, le mail porte des
    # noms de clients et des montants — assumé, décidé explicitement.
    default_recipients:
      - emilia@archides.fr
      - philippe@archides.fr
      - hatim@archides.fr
      - externe-onepilot@merveil.co

  blacklist:
    # Réservation d'une personne signalée par la RC (2026-08-29).
    # ⚠ Bucket DISTINCT de `fraude` uniquement pour la liste de diffusion :
    # RC + direction, SANS Philippe (arbitrage 29/08 — une personne blacklistée
    # est un sujet RC/accueil, pas une écriture comptable ; à rouvrir si le
    # besoin apparaît). Les destinataires se règlent PAR BUCKET, il n'existe pas
    # d'override par trigger dans le dispatcher — d'où ce bucket plutôt qu'un
    # paramètre sur l'action.
    # ⚠ Ces adresses sont des adresses d'ENVOI : `raphael@archides.fr` (comme au
    # bucket beyond) et non `raphael.elie@archides.fr`, qui est son compte IAP
    # côté dashboard. Les deux coexistent, ne pas les aligner à la volée.
    # ⚠ `hello@merveil.co` (2026-08-31, demande Hatim) = la boîte partagée de la
    # RC, seul destinataire hors domaine archides.fr de tous les buckets. C'est
    # elle qui met l'alerte devant l'agent d'astreinte plutôt que devant une
    # personne nommée en congés — mais elle est aussi lue par des externes
    # (OnePilot) : ne jamais y router un bucket portant un code de porte.
    # ⚠ flush_with OBLIGATOIRE sur tout bucket satellite : sans lui le bucket
    # est bufferisé puis JETÉ sans erreur (incident data_quality 2026-07-17).
    flush_with: 2h
    send_if_empty: false
    subject_prefix: "[Merveil Blacklist]"
    default_recipients:
      - emilia@archides.fr
      - hello@merveil.co
      - hatim@archides.fr
      - mickael@archides.fr
      - raphael@archides.fr

# ============================================================================
# Triggers
# ============================================================================

triggers:

  # ── Gouvernance données fixes (POC 2026-06-30) ────────────────────────────
  # Violation de contrat détectée par dbt (dash_governance_contracts) sur les
  # données de référence du DWH Feed. 1 alerte/domaine/jour, routée à l'owner.
  data_contract_breach:
    enabled: true
    actions:
      - type: email_digest
        bucket: data_quality

  # ── Tests dbt (chantier tests 2026-07-03) ──────────────────────────────────
  # Échecs de `dbt test` post-run (dbt_raw.test_runs, 1 trigger agrégé/jour).
  # CRITICAL = erreur SQL (test cassé), WARNING = assertion violée par la donnée.
  dbt_test_failure:
    enabled: true
    actions:
      - type: email_digest
        bucket: data_quality

  # ── Continuité des flux finance (2026-07-17) ──────────────────────────────
  # Un flux de données compta silencieux = trou invisible (exports Mews perdus
  # sans retry, job factures en PERMISSION_DENIED 3 sem.). 1 alerte/flux/jour.
  finance_flow_stale:
    enabled: true
    actions:
      - type: email_digest
        bucket: data_quality

  # ── Continuité des enrichissements GenAI (2026-08-13) ─────────────────────
  # Depuis le fix BatchStillRunning (un batch Vertex lent sort en SUCCÈS, sans
  # retry ni re-soumission payée), le statut Cloud Run ne détecte plus un
  # pipeline genai bloqué → on surveille la fraîcheur des tables genai.* .
  # Seuils calés sur les trous réels observés (cf. trigger_genai_stale.sql).
  genai_stale:
    enabled: true
    actions:
      - type: email_digest
        bucket: data_quality

  # ── Fraude / chargebacks (2026-08-15) ─────────────────────────────────────
  # Un litige non contesté est perdu d'office et on a 48 h pour les preuves :
  # sur 19 chargebacks 2026 (40 033 €), un seul a été récupéré.
  new_chargeback:
    enabled: true
    actions:
      - type: email_digest
        bucket: fraude

  # On a remboursé ET subi le chargeback : le même litige payé deux fois.
  # 3 cas trouvés en reprenant 2026 (2 831,50 €), aucun repéré à l'époque.
  payment_double_exit:
    enabled: true
    actions:
      - type: email_digest
        bucket: fraude

  # Suspicion fraude AVANT l'arrivée (2026-08-19) : ≥2 signaux parmi
  # {direct réservé ≤72h, échecs CB direct, nom de la pièce ≠ nom résa}.
  # Combo calibré par backtest (ADR 19/08 : 13 cas/7,5 mois — Rachel Williams
  # 5 915 €, cas Hamdaoui). Un signal isolé ne mail JAMAIS (badge 6.1/6.7).
  # Vérification humaine avant remise des clés — cadre N3.
  fraude_identite:
    enabled: true
    actions:
      - type: email_digest
        bucket: fraude

  # Réservation d'une personne signalée par la RC (2026-08-29). La liste est
  # tenue par Emilia depuis 6.7 (mode record, dwh_inputs.record_edits) : c'est
  # un verdict humain déjà rendu, pas un signal statistique — d'où le mail dès
  # que la résa apparaît, sans attendre l'approche du check-in.
  # ⚠ Ne part QUE sur un rapprochement exact (customer_id) ou fort (email /
  # téléphone). Un homonyme ne mail jamais : 458 noms sont partagés par 957
  # profils en base, « Rachel Williams » désigne 2 personnes distinctes.
  blacklist_resa:
    enabled: true
    actions:
      - type: email_digest
        bucket: blacklist

  # Test de cartes (2026-09-01, ADR) : ≥2 refus carte pour MOTIF DE FRAUDE
  # (FRAUD / Issuer Suspected Fraud) sur une résa Site direct à venir, dernier
  # refus < 48 h. La seule alerte fraude qui DEMANDE un geste immédiat : la RC
  # vérifie puis ANNULE (accord direction 31/08 — rien d'automatisé, jamais).
  # Backtest 12 mois : 9 résas, toutes la campagne du 07-19/08, 0 faux positif.
  test_cartes:
    enabled: true
    actions:
      - type: email_digest
        bucket: fraude
      # ⭐ Auto-blacklist (2026-09-01, décision Hatim) : la machine crée la fiche
      # 6.7 elle-même (gravite=vigilance, jamais interdiction — elle PROPOSE,
      # l'interdiction reste humaine). Le fraudeur s'auto-annule en ~30 min :
      # la fiche est ce qui prolonge la détection au-delà des 48 h du signal
      # jumelle. 1 fiche par profil Mews, liées entre elles par la note.
      - type: blacklist_add

  # ── Alertes consolidées dans le daily (2026-05-30) ────────────────────────
  # Anciennement bucket 4h. Bascule daily pour réduire le bruit (60 alertes ×
  # 6 fois/jour → 1 mail/jour). Le scheduler merveil-action-engine-4h est
  # pausé en conséquence. Les annulations VIP restent doublonnées par le mail
  # RC 11h (cancellations-brief) — pas de perte d'info.
  cancellation_vip:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  satisfaction_low_review:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  last_minute_checkin:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  double_booking:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  checkin_no_apartment:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  # ── Alertes daily (= ancien rule_daily.sql) ────────────────────────────────
  abandoned_cart:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  revenue_anomaly_adr:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  revenue_anomaly_adr_per_room:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  revenue_apt_zero:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  low_occupation:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  high_cancellations_daily:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  cancellation_large_apt:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  superhost_risk:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  dispo_daily_summary:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  gap_pricing_summary:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  beyond_surcote_gap:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  # 🎉 Gap 1N vendu alors qu'une fenêtre DWH était poussée (job beyond_push).
  # Signal de succès du push auto — volume faible, digest daily suffit.
  beyond_gap_filled:
    enabled: true
    actions:
      - type: email_digest
        bucket: beyond

  # Atterrissage budget : mois courant projeté < 90% du budget (dès le 10 du mois)
  # + M+1 avec OTB < 50% (dès le 15). Source : trigger_budget_landing_gap
  # sur dash_ventes_budget (édition la plus récente).
  budget_landing_gap:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  # ── Triggers nécessitant des actions ciblées ──────────────────────────────
  champagne_direct:
    enabled: false   # legacy disabled
    actions:
      - type: breezeway_task
        params:
          name_template: "Bouteille de champagne — {apartment_name}"
          department: housekeeping
          subdepartment: linge_conso_logistique
          priority: normal
          assign_economat: true
          assign_cleaning_team: true

  low_review_cleanliness:
    enabled: true    # ancien rule, à activer
    actions:
      - type: breezeway_task
        params:
          name_template: "Inspection propreté — {apartment_name}"
          department: housekeeping
          priority: high

  # ── POC Asana — nouveau trigger ─────────────────────────────────────────────
  inspection_overdue:
    enabled: false   # désactivé tant que ASANA_PAT pas en Secret Manager prod
    actions:
      - type: asana_task
        params:
          workspace_id: "1199370302253551"   # MERVEIL
          project_id: "1214996499081074"     # Projet "Test"
          name_template: "Inspection en retard — {apartment_code} ({days_since_inspection}j)"
          notes_template: |
            Apart : {apartment_name}
            Dernière inspection : {last_inspection_date}
            Jours depuis : {days_since_inspection}j (seuil = 90j)

            Lien dashboard : https://direction.archides.fr/qualite?tab=operationnel
          due_offset_days: 3
          # assignee_email: "hassana@archides.fr"   # à confirmer

  # ── ISEO / serrures — sécurité accès guest ────────────────────────────────
  # Guest en place / arrivée imminente sans code Sofia tracké (incident Crystal
  # Balcom 2026-06-10). CRITICAL si in-house sans ouverture ≤48h. Bucket 2h →
  # job merveil-action-engine-2h (latence ≤2h). Destinataires = digest_buckets.2h.
  iseo_pin_missing:
    enabled: true
    actions:
      - type: email_digest
        bucket: 2h

  # Code fixe utilisé sur un logement vide, sans intervention ops tracée.
  # Bucket 2h : c'est la seule alerte du parc qui puisse signaler quelqu'un DANS
  # un appartement — la porter au digest quotidien lui ferait perdre son sens.
  # Volume mesuré 17/08 : ~2/mois (313 ouvertures hors séjour en 60 j ramenées à 4
  # une fois l'activité Breezeway déduite).
  iseo_code_fixe_intrusion:
    enabled: true
    actions:
      - type: email_digest
        bucket: 2h

  # Serrure qui répond mais ne remonte plus le clavier : rend aveugle l'alerte
  # ci-dessus ET le suivi des entrées client. Quotidien — c'est une panne à
  # réparer, pas un événement à intercepter.
  iseo_clavier_muet:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  # Saturation de la licence Luckey.
  # ⚠ Passé de `2h` à `daily` le 19/08 (demande Hatim) : la saturation est un ÉTAT,
  # pas un événement — tant qu'on est au-dessus du seuil, la répéter toutes les 2 h
  # ne fait qu'apprendre à ignorer le mail. Une fois par jour suffit à ne pas
  # l'oublier. Contrepartie assumée : si le plafond tombe juste après le digest,
  # on l'apprend par l'échec de programmation (mail d'erreur de l'orchestrateur,
  # qui lui tourne toutes les 2 h) et non par cette alerte.
  iseo_quota_licence:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  # Code DWH accepté par Sofia mais jamais écrit dans la serrure (rule_state
  # NOT_UPDATED > 12 h) alors que le séjour approche — le client tapera un code
  # que la serrure ne connaît pas. Né de l'incident 23-24/08 (iseo-vision §12) :
  # 7 séjours touchés depuis le 08/08 sans une alerte, personne ne lisait
  # `rule_state`, le seul accusé d'écriture en serrure. Bucket daily : c'est une
  # panne à réparer (resync / gateway), pas un événement à intercepter — le
  # property_id journalier du trigger assure un rappel par jour jusqu'à
  # résolution, et la RC a le repli immédiat (codes fixes, 6.1).
  iseo_code_non_propage:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  iseo_etl_stale:
    enabled: true
    actions:
      - type: email_digest
        bucket: 2h

  # Écarts cache DWH ↔ Sofia (dash_ops_pin_reconciliation). MISSING_IN_SOFIA = code
  # supprimé UI Sofia pendant séjour (incident Crystal Balcom). Bucket 2h.
  iseo_reconciliation:
    enabled: true
    actions:
      - type: email_digest
        bucket: 2h

  # HyperGate ISEO sans connexion depuis > 7j (stg_iseo__gateways). Les serrures
  # qu'elle dessert ne remontent plus d'events et ne sont plus pilotables à
  # distance — panne silencieuse jusqu'à l'arrivée du guest. Bucket daily : une
  # gateway tombée est un déplacement terrain, pas une urgence des 2 prochaines
  # heures, et le snapshot ne bouge que 12×/jour.
  iseo_gateway_offline:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  # Passerelle qui RÉPOND au cloud mais n'écrit plus les codes dans ses serrures.
  # ⚠ Ne fait PAS doublon avec `iseo_gateway_offline` : celui-ci lit la connexion,
  # donc il attrape une passerelle débranchée. Les 6 passerelles de l'incident du
  # 08-24/08 pinguaient toutes normalement — vertes pour lui — pendant que 7 séjours
  # recevaient un code jamais écrit en serrure. Garder les deux.
  # Bucket daily et pas 2h : une file de synchro coincée est un état PERSISTANT,
  # le répéter 12×/jour apprend à ignorer l'expéditeur (leçon LAO4 du 20/08).
  iseo_gateway_push_stuck:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  # ── Trésorerie ────────────────────────────────────────────────────────────
  # Compte bancaire sous son seuil (seed treasury_thresholds). Le message propose
  # le montant à virer. Bucket daily (snapshot bancaire daily). N2 → N3.
  treasury_low:
    enabled: false   # alerte désactivée — visualisation dashboard d'abord (2026-06-25)
    actions:
      - type: email_digest
        bucket: daily

  # ── Désactivés ────────────────────────────────────────────────────────────
  client_risk:
    enabled: false   # legacy disabled (clients_at_risk hors UNION dash_alerts)
    actions:
      - type: email_digest
        bucket: daily
