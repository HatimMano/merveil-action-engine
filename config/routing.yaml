# ============================================================================
# routing.yaml — Mapping trigger → actions
# ============================================================================
#
# Décision : cf. decisions.md 2026-05-21 — Refacto trigger/action/routing.
#
# Pour chaque trigger_name produit par dbt (table action_engine.triggers),
# liste les actions à exécuter quand une occurrence non encore traitée est détectée.
#
# Une action est typée :
#   - type: email_digest    — accumulée dans 1 mail par bucket (4h / daily / weekly)
#   - type: asana_task      — création de tâche Asana
#   - type: breezeway_task  — création de tâche Breezeway
#
# Idempotence : par (trigger_name, property_id, action_type) dans dispatched_actions.
# Si une action est déjà 'open' (= pas resolved), elle n'est pas redispatchée.
#
# Backlog : externaliser ce fichier vers DWH Feed Sheets (table BQ alimentée
# depuis Sheets) pour édition par Mickael sans commit. Voir Archides/CLAUDE.md.
# ============================================================================

# Recipients par défaut par bucket. Surchargeable per-trigger via params.recipients.
digest_buckets:
  2h:
    # Serrures — sécurité accès guest. Job merveil-action-engine-2h toutes les 2h.
    # TODO recipients : passer sur l'alias ops-front quand connu.
    send_if_empty: false
    subject_prefix: "[Merveil Serrures]"
    default_recipients:
      - alerte_ventes@archides.fr
      - hatim@archides.fr
  4h:
    send_if_empty: true
    subject_prefix: "[Merveil 4H]"
    default_recipients:
      - alerte_ventes@archides.fr
      - hatim@archides.fr
  daily:
    send_if_empty: false
    subject_prefix: "[Merveil Daily]"
    default_recipients:
      - alerte_ventes@archides.fr
      - hatim@archides.fr

  data_quality:
    # Gouvernance données fixes — violations de contrat (POC ops_apparts, owner Emilia).
    # ⚠ POC : route vers Hatim le temps de la validation. Pour passer en prod, basculer
    # default_recipients sur l'owner (emilia@archides.fr), ou implémenter le routage
    # dynamique depuis gouvernance_ownership.alert_email (évolution handler — Phase 2).
    # flush_with: daily = flushé par le job daily 7h (fix 2026-07-17 : sans ce champ,
    # le bucket était bufferisé puis jeté — 0 mail envoyé depuis sa création).
    flush_with: daily
    send_if_empty: false
    subject_prefix: "[Merveil Gouvernance]"
    default_recipients:
      - hatim@archides.fr

  beyond:
    # Push auto Beyond (gaps 1N) — succès de vente sous fenêtre DWH.
    # Destinataires dédiés (décision Hatim 17/07). Flushé par le job daily 7h.
    flush_with: daily
    send_if_empty: false
    subject_prefix: "[Merveil Beyond]"
    default_recipients:
      - hatim@archides.fr
      - raphael@archides.fr
      - mickael@archides.fr

  fraude:
    # Chargebacks et doubles sorties. Destinataires : Emilia (dossiers de preuve,
    # relation OTA) + Hatim. Philippe à ajouter quand la compta s'en saisit.
    # ⚠ flush_with OBLIGATOIRE sur tout bucket satellite : sans lui le bucket est
    # bufferisé puis JETÉ sans erreur (incident data_quality, 2026-07-17).
    # Flushé par le job 2h : `trigger_new_chargeback` a 48 h pour agir, le daily
    # perdrait la moitié de la fenêtre.
    flush_with: 2h
    send_if_empty: false
    subject_prefix: "[Merveil Fraude]"
    default_recipients:
      - hatim@archides.fr

# ============================================================================
# Triggers
# ============================================================================

triggers:

  # ── Gouvernance données fixes (POC 2026-06-30) ────────────────────────────
  # Violation de contrat détectée par dbt (dash_governance_contracts) sur les
  # données de référence du DWH Feed. 1 alerte/domaine/jour, routée à l'owner.
  data_contract_breach:
    enabled: true
    actions:
      - type: email_digest
        bucket: data_quality

  # ── Tests dbt (chantier tests 2026-07-03) ──────────────────────────────────
  # Échecs de `dbt test` post-run (dbt_raw.test_runs, 1 trigger agrégé/jour).
  # CRITICAL = erreur SQL (test cassé), WARNING = assertion violée par la donnée.
  dbt_test_failure:
    enabled: true
    actions:
      - type: email_digest
        bucket: data_quality

  # ── Continuité des flux finance (2026-07-17) ──────────────────────────────
  # Un flux de données compta silencieux = trou invisible (exports Mews perdus
  # sans retry, job factures en PERMISSION_DENIED 3 sem.). 1 alerte/flux/jour.
  finance_flow_stale:
    enabled: true
    actions:
      - type: email_digest
        bucket: data_quality

  # ── Continuité des enrichissements GenAI (2026-08-13) ─────────────────────
  # Depuis le fix BatchStillRunning (un batch Vertex lent sort en SUCCÈS, sans
  # retry ni re-soumission payée), le statut Cloud Run ne détecte plus un
  # pipeline genai bloqué → on surveille la fraîcheur des tables genai.* .
  # Seuils calés sur les trous réels observés (cf. trigger_genai_stale.sql).
  genai_stale:
    enabled: true
    actions:
      - type: email_digest
        bucket: data_quality

  # ── Fraude / chargebacks (2026-08-15) ─────────────────────────────────────
  # Un litige non contesté est perdu d'office et on a 48 h pour les preuves :
  # sur 19 chargebacks 2026 (40 033 €), un seul a été récupéré.
  new_chargeback:
    enabled: true
    actions:
      - type: email_digest
        bucket: fraude

  # On a remboursé ET subi le chargeback : le même litige payé deux fois.
  # 3 cas trouvés en reprenant 2026 (2 831,50 €), aucun repéré à l'époque.
  payment_double_exit:
    enabled: true
    actions:
      - type: email_digest
        bucket: fraude

  # ── Alertes consolidées dans le daily (2026-05-30) ────────────────────────
  # Anciennement bucket 4h. Bascule daily pour réduire le bruit (60 alertes ×
  # 6 fois/jour → 1 mail/jour). Le scheduler merveil-action-engine-4h est
  # pausé en conséquence. Les annulations VIP restent doublonnées par le mail
  # RC 11h (cancellations-brief) — pas de perte d'info.
  cancellation_vip:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  satisfaction_low_review:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  last_minute_checkin:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  double_booking:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  checkin_no_apartment:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  # ── Alertes daily (= ancien rule_daily.sql) ────────────────────────────────
  abandoned_cart:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  revenue_anomaly_adr:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  revenue_anomaly_adr_per_room:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  revenue_apt_zero:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  low_occupation:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  high_cancellations_daily:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  cancellation_large_apt:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  superhost_risk:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  dispo_daily_summary:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  gap_pricing_summary:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  beyond_surcote_gap:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  # 🎉 Gap 1N vendu alors qu'une fenêtre DWH était poussée (job beyond_push).
  # Signal de succès du push auto — volume faible, digest daily suffit.
  beyond_gap_filled:
    enabled: true
    actions:
      - type: email_digest
        bucket: beyond

  # Atterrissage budget : mois courant projeté < 90% du budget (dès le 10 du mois)
  # + M+1 avec OTB < 50% (dès le 15). Source : trigger_budget_landing_gap
  # sur dash_ventes_budget (édition la plus récente).
  budget_landing_gap:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  # ── Triggers nécessitant des actions ciblées ──────────────────────────────
  champagne_direct:
    enabled: false   # legacy disabled
    actions:
      - type: breezeway_task
        params:
          name_template: "Bouteille de champagne — {apartment_name}"
          department: housekeeping
          subdepartment: linge_conso_logistique
          priority: normal
          assign_economat: true
          assign_cleaning_team: true

  low_review_cleanliness:
    enabled: true    # ancien rule, à activer
    actions:
      - type: breezeway_task
        params:
          name_template: "Inspection propreté — {apartment_name}"
          department: housekeeping
          priority: high

  # ── POC Asana — nouveau trigger ─────────────────────────────────────────────
  inspection_overdue:
    enabled: false   # désactivé tant que ASANA_PAT pas en Secret Manager prod
    actions:
      - type: asana_task
        params:
          workspace_id: "1199370302253551"   # MERVEIL
          project_id: "1214996499081074"     # Projet "Test"
          name_template: "Inspection en retard — {apartment_code} ({days_since_inspection}j)"
          notes_template: |
            Apart : {apartment_name}
            Dernière inspection : {last_inspection_date}
            Jours depuis : {days_since_inspection}j (seuil = 90j)

            Lien dashboard : https://direction.archides.fr/qualite?tab=operationnel
          due_offset_days: 3
          # assignee_email: "hassana@archides.fr"   # à confirmer

  # ── ISEO / serrures — sécurité accès guest ────────────────────────────────
  # Guest en place / arrivée imminente sans code Sofia tracké (incident Crystal
  # Balcom 2026-06-10). CRITICAL si in-house sans ouverture ≤48h. Bucket 2h →
  # job merveil-action-engine-2h (latence ≤2h). Destinataires = digest_buckets.2h.
  iseo_pin_missing:
    enabled: true
    actions:
      - type: email_digest
        bucket: 2h

  iseo_etl_stale:
    enabled: true
    actions:
      - type: email_digest
        bucket: 2h

  # Écarts cache DWH ↔ Sofia (dash_ops_pin_reconciliation). MISSING_IN_SOFIA = code
  # supprimé UI Sofia pendant séjour (incident Crystal Balcom). Bucket 2h.
  iseo_reconciliation:
    enabled: true
    actions:
      - type: email_digest
        bucket: 2h

  # HyperGate ISEO sans connexion depuis > 7j (stg_iseo__gateways). Les serrures
  # qu'elle dessert ne remontent plus d'events et ne sont plus pilotables à
  # distance — panne silencieuse jusqu'à l'arrivée du guest. Bucket daily : une
  # gateway tombée est un déplacement terrain, pas une urgence des 2 prochaines
  # heures, et le snapshot ne bouge que 12×/jour.
  iseo_gateway_offline:
    enabled: true
    actions:
      - type: email_digest
        bucket: daily

  # ── Trésorerie ────────────────────────────────────────────────────────────
  # Compte bancaire sous son seuil (seed treasury_thresholds). Le message propose
  # le montant à virer. Bucket daily (snapshot bancaire daily). N2 → N3.
  treasury_low:
    enabled: false   # alerte désactivée — visualisation dashboard d'abord (2026-06-25)
    actions:
      - type: email_digest
        bucket: daily

  # ── Désactivés ────────────────────────────────────────────────────────────
  client_risk:
    enabled: false   # legacy disabled (clients_at_risk hors UNION dash_alerts)
    actions:
      - type: email_digest
        bucket: daily
