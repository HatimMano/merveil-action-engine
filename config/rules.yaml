# Action Engine — Configuration
# ==============================
#
# `rules` : handlers non-digest (Breezeway, etc.)
#   Chaque rule_name correspond à une entrée dans pending_actions.
#
# `digest` : config email par fréquence (4h / daily / weekly / monthly)
#   L'action-engine lit rule_{freq} et envoie 1 mail groupé.

rules:

  champagne_direct:
    enabled: false
    destinations:
      - type: breezeway_task
        params:
          name_template: "Bouteille de champagne — {apartment_name}"
          department: housekeeping
          subdepartment: linge_conso_logistique
          priority: normal
          assign_economat: true
          assign_cleaning_team: true

  low_review_cleanliness:
    enabled: true
    destinations:
      - type: breezeway_task
        params:
          name_template: "Inspection propreté — {home_name}"
          department: housekeeping
          priority: high

  # ── POC Asana (désactivé tant que ASANA_PAT pas en Secret Manager) ─────────
  # Idempotence : source_key encodé dans les notes (free tier — pas de custom fields)
  inspection_overdue:
    enabled: false
    destinations:
      - type: asana_task
        params:
          workspace_id: "1199370302253551"    # MERVEIL workspace
          project_id:   "1214996499081074"    # Projet "Test" (à changer pour le projet ops réel)
          name_template: "Inspection en retard — {apartment_code} ({days_since_inspection}j)"
          notes_template: |
            Apart : {apartment_name}
            Dernière inspection : {last_inspection_date}
            Jours depuis : {days_since_inspection}j (seuil = 90j)

            Lien dashboard : https://direction.archides.fr/qualite?tab=operationnel
          due_offset_days: 3
          # assignee_email: "hassana@archides.fr"   # à confirmer avec Mickael

digest:
  4h:
    to: "alerte_ventes@archides.fr, hatim@archides.fr"
    send_if_empty: true

  daily:
    to: "alerte_ventes@archides.fr, hatim@archides.fr"
    send_if_empty: false

  weekly:
    to: "alerte_ventes@archides.fr, hatim@archides.fr"
    send_if_empty: false
